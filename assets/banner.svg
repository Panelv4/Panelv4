  <text x="66" y="252" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="16" letter-spacing="1.5" fill="#6F8A93">AI-ASSISTED PRODUCT BUILDER   /   GWALIOR, MP, INDIA</text>

