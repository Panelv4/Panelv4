<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Dhairya Sharma, also known as Panelv4, application security researcher, three public CVEs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B10"/>
      <stop offset="0.55" stop-color="#0C1520"/>
      <stop offset="1" stop-color="#08202A"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="75%">
      <stop offset="0" stop-color="#7CFFCB" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#6CB6FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7CFFCB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7CFFCB" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CFFCB"/>
      <stop offset="0.6" stop-color="#6CB6FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7CFFCB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="5" height="320" fill="#7CFFCB"/>

  <!-- corner ticks -->
  <path d="M20 20h34M20 20v34M1260 20h-34M1260 20v34M20 300h34M20 300v-34M1260 300h-34M1260 300v-34"
