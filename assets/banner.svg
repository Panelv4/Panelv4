  <text x="830" y="122" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#7CFFCB">$ grep -c reporter advisories/*</text>
  <text x="830" y="150" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#DCEAE6">3  public CVEs  ·  credited: Panelv4</text>
