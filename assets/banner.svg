  <circle cx="836" cy="206" r="4" fill="#FFC978"/>
  <text x="852" y="211" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#C9D8D4">CVE-2026-117518   HIGH      8.2</text>
