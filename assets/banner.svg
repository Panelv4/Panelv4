  <text x="62" y="158" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" letter-spacing="1.5" fill="#F1F8F6">DHAIRYA SHARMA</text>
  <rect x="66" y="178" width="560" height="3" fill="url(#rule)"/>
