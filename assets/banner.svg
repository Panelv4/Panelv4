  <rect x="806" y="52" width="410" height="216" rx="10" fill="#060C11" fill-opacity="0.78" stroke="#7CFFCB" stroke-opacity="0.35"/>
  <rect x="806" y="52" width="410" height="34" rx="10" fill="#101B22"/>
  <rect x="806" y="76" width="410" height="10" fill="#101B22"/>
